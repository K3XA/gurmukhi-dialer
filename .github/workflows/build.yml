name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -oq *.zip
          echo "=== Project files ==="
          ls -la
          echo "=== Gradle files ==="
          find . -maxdepth 2 -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GurmukhiDialer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
