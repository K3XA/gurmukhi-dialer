name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q *.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        working-directory: GurmukhiDialer
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GurmukhiDialer-debug-apk
          path: GurmukhiDialer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
